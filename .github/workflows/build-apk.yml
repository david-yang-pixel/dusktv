name: Build Android APK

# Every merge to main builds an APK and publishes it as a GitHub Release.
# Pull requests build the same APK to prove it still compiles, but only attach it
# to the workflow run; they never publish a release.
# The version is "<package.json version>.<build number>", e.g. 0.1.0.37, so each
# release is unique and newer builds always install over older ones.
on:
  push:
    branches: [main]
    # Changes that cannot affect the APK do not cut a release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshot/**"
      - "preview/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshot/**"
      - "preview/**"
      - ".github/ISSUE_TEMPLATE/**"
  # Manual run from the Actions tab, on any branch. Builds from a branch other
  # than main are published as pre-releases.
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same pull request replaces its build. Builds of main are never cancelled.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  direct_build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # The app shows the version from package.json, Android's versionName follows
      # it, and versionCode must keep rising for an update to install.
      - name: Stamp version
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const write = (file, data) => fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
            const build = Number(process.env.BUILD_NUMBER);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = `${pkg.version}.${build}`;
            write("package.json", pkg);
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = build;
            write("app.json", app);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          '

      - name: Build APK
        env:
          # The version stamp leaves the checkout modified on purpose.
          EXPO_NO_GIT_STATUS: "1"
        run: yarn build

      - name: Rename APK file
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/dusktv.${{ steps.version.outputs.version }}.apk

      - name: Attach APK to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: dusktv.${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 14

      - name: Create Release and Upload APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: |
            暮映 · DuskTV ${{ steps.version.outputs.version }}

            - 安装包：`dusktv.${{ steps.version.outputs.version }}.apk`（Android TV 与 Android 手机通用）
            - 构建自：${{ github.ref_name }} @ ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: artifacts/dusktv.${{ steps.version.outputs.version }}.apk
